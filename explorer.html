<!doctype html>
<html lang="en" data-layout="workbench">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Explorer · MiniMe Atlas</title>
<script src="assets/js/theme.js"></script>
<script data-mm="prepaint">(function(d,w){var r=d.documentElement,s=null,v=w.innerWidth;try{s=localStorage.getItem("minime_sidebar")}catch(e){}if(/[?&]legacy=1(&|$)/.test(w.location.search))return;r.dataset.sidebar=v<=760?"drawer":s==="open"||s==="collapsed"?s:r.dataset.layout==="workbench"||v<1100?"collapsed":"open"})(document,window)</script>
<link rel="preload" href="assets/fonts/sora-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/explorer.css">
</head>
<body data-page="explorer"><main class="ex" id="ex">
  <aside class="ex-side" id="ex-side" aria-label="Files">
    <div class="ex-side__head">
      <input id="ex-q" class="ex-q" type="search" placeholder="Filter files ( / )" aria-label="Filter files by path" autocomplete="off">
      <span id="ex-count" class="ex-count" aria-live="polite"></span>
      <button id="ex-sheet-close" class="mm-btn ex-sheet-close" type="button">Close</button>
    </div>
    <div id="ex-tree"></div>
    <p class="ex-side__foot"><span class="ex-dots" aria-hidden="true"><i class="is-on"></i><i class="is-on"></i><i></i><i></i></span> files with an AI note &nbsp;<span class="ex-mark ex-mark--fresh" aria-hidden="true"></span> fresh <span class="ex-mark ex-mark--stale" aria-hidden="true"></span> stale</p>
  </aside>
  <div id="ex-resize" class="ex-resize" role="separator" aria-orientation="vertical" aria-label="Resize the file tree" aria-valuemin="220" aria-valuemax="520" aria-valuenow="300" tabindex="0"></div>
  <section id="ex-main" class="ex-main" tabindex="-1"><p class="ex-dim">Loading the code index&hellip;</p><noscript><p class="ex-err">The Explorer needs JavaScript.</p></noscript></section>
  <aside id="ex-insp" class="ex-insp" aria-label="Relations and history"></aside>
  <button id="ex-tree-btn" class="mm-btn ex-tree-btn" type="button" aria-expanded="false" aria-controls="ex-side">Files</button>
</main>
<script type="module" src="assets/js/explorer/main.js"></script>
<script type="module" src="assets/js/shell.js"></script>
</body>
</html>
