# Catches a broken Atlas before it is deployed: links, anchors, titles, JSON, size budget, and the unit tests.
#
# Separate from refresh-atlas.yml on purpose. That job rewrites pages from data/census.json and pushes with
# the default token (which does not trigger other workflows); this one only reads and reports.
# Run the same thing locally:
#     python scripts/check_site.py
#     python scripts/test_check_site.py
#     python scripts/test_refresh_atlas.py
#     python scripts/test_refresh_graph.py
#     python scripts/build_index.py --check
#     python scripts/test_build_index.py
#     python scripts/test_palette.py
#     python scripts/test_reader.py
#     python scripts/test_library.py
#     python scripts/test_overview.py
#     python scripts/test_topology.py
#     python scripts/test_arch_render.py
#     python scripts/test_codemod_shell.py
#     python scripts/build_code.py --check
#     python scripts/test_build_code.py
#     python scripts/notes.py validate
#     python scripts/test_notes.py
#     python scripts/arch.py build --check
#     python scripts/arch.py validate
#     python scripts/test_arch.py
#     python scripts/refresh_source.py --check
#     python scripts/test_refresh_source.py
#     python scripts/test_links.py
#     python scripts/vendor_highlight.py --check
#     python scripts/test_vendor_highlight.py
#     python scripts/test_todo_api.py
#     python scripts/test_codepages.py
#     python scripts/refresh_protocol.py --check
#     python scripts/test_refresh_protocol.py
name: Site check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check links, anchors, titles, JSON and size budget
        run: python3 scripts/check_site.py
      - name: Search index is current
        run: python3 scripts/build_index.py --check
      - name: Code data (data/code) is current
        run: python3 scripts/build_code.py --check
      - name: Notes in data/notes follow the schema
        run: python3 scripts/notes.py validate
      - name: Architecture model is current and its flows follow the schema
        run: |
          python3 scripts/arch.py build --check
          python3 scripts/arch.py validate
      - name: Embedded source (data/src) matches its manifest and the census commit
        run: python3 scripts/refresh_source.py --check
      - name: Protocol data (data/code/protocol.json) is at the census commit
        run: python3 scripts/refresh_protocol.py --check
      - name: Vendored highlight.js (assets/vendor/highlight) is the pinned version
        run: python3 scripts/vendor_highlight.py --check
      - name: Unit tests
        run: |
          python3 scripts/test_check_site.py
          python3 scripts/test_refresh_atlas.py
          python3 scripts/test_refresh_graph.py
          python3 scripts/test_build_index.py
          python3 scripts/test_palette.py
          python3 scripts/test_reader.py
          python3 scripts/test_library.py
          python3 scripts/test_overview.py
          python3 scripts/test_topology.py
          python3 scripts/test_arch_render.py
          python3 scripts/test_codemod_shell.py
          python3 scripts/test_build_code.py
          python3 scripts/test_notes.py
          python3 scripts/test_arch.py
          python3 scripts/test_refresh_source.py
          python3 scripts/test_links.py
          python3 scripts/test_vendor_highlight.py
          python3 scripts/test_todo_api.py
          python3 scripts/test_codepages.py
          python3 scripts/test_refresh_protocol.py
