del reads the repo and records: the real module paths for every item in \u00a71 (store, link, auth, policy engine, sandbox, secrets, hooks, skills, instructions/memory loader, tool classes, MCP client, TUI), their public function and class signatures, the server's profile handling, the tool catalog format, the protocol version and message list, the migration numbers used so far, and the commands to run each test suite. Also record anything from \u00a71 that is **missing**. *Done when:* every \u00a71 row is marked present, partly present or missing with a path; the test commands are verified to run green on the current commit. *Why first:* this guide cannot know M2C's final layout, and every later patch depends on the facts in this file."},{"id":"MT-A01","title":"Automation spec: schema, parser, validator","size":"M","wave":1,"note":"","phase":"Phase 0 \u2014 Foundations","track":"A","slug":"mt-a01-automation-spec-schema-parser-validator-m","impl":"product guide \u00a76.2. *Files (new):* `protocol/spec/automation.schema.json`, `minicore/src/minicore/automation/{spec.py,validate.py}` (or `menux/` until K01 lands), tests, `docs/menux/automation-spec.md`. *What:* The YAML spec from product guide \u00a76.2: `id`","files":"","what":"The YAML spec from product guide \u00a76.2: `id`, `description`, `trigger` (cron, interval, heartbeat, file, webhook, poll, message, manual), `agent` (`profile`, `model_class`, `instructions`, `pipeline` for reader/actor), `capabilities` (connector tools, channel tools, folders with `r`/`rw`), `policy` (`tier_max`, `unattended`, `approvals`, `egress`), `budget` (`per_run_credits`, `per_day_credits`, `per_month_credits`), `quiet_hours`, `missed_run`, `notify_on_failure`. JSON Schema plus a validator that adds semantic checks: capabilities must exist in the capability registry (T01), `tier_max` must cover every listed capability's tier, an unattended spec may not list any capability above T2, an unattended spec with untrusted-content tools must declare the reader/actor pipeline, `egress` is a closed list, budgets are positive. *Done when:* valid and invalid fixtures; every semantic rule has a failing test; the same module is importable by the server (Planner) and the node."},{"id":"MT-T01","title":"Tier model and capability registry","size":"M","wave":1,"note":"","phase":"Phase 0 \u2014 Foundations","track":"T","slug":"mt-t01-tier-model-and-capability-registry-m-wave","impl":"product guide \u00a711.2; \u00a72 O6. *Files (new):* `minicore/src/minicore/tiers/{tiers.py,registry.py}`, `docs/menux/tiers.md`, tests. *What:* The T0\u2013T5 enumeration with ordering; a **capability registry** (`capability_id \u2192 {tier, read_or_write, egress_domains, des","files":"","what":"The T0\u2013T5 enumeration with ordering; a **capability registry** (`capability_id \u2192 {tier, read_or_write, egress_domains, description, confirm_phrase?}`); the effective-tier function from O6; a loader for connector manifests (H01). Pure data and functions, no I/O. *Done when:* tests for ordering, effective tier, unknown capability (treated as T5 and denied), and registry loading."},{"id":"MT-K01","title":"Extract `minicore` from M2C","size":"L","wave":2,"note":"","phase":"Phase 0 \u2014 Foundations","track":"K","slug":"mt-k01-extract-minicore-from-m2c-l-wave-2","impl":"","files":"new `minicore/` package; `m2c/` modules moved and replaced by thin re-exports; `pyproject.toml` files; CI.","what":"**Behavior-preserving move.** Using the inventory (K00), move the shared modules (store, link, auth, policy, sandbox, secrets, hooks, skills loader, instructions/memory loader, tool base classes, checkpoints) into `minicore/src/minicore/`. Keep `m2c.*` import paths working with re-exports for one release. No logic changes. *Done when:* **every M2C test passes unchanged** (only import lines may differ); `minicore` has its own test suite carrying the moved tests; a new empty `menux/` package imports `minicore` in CI. *Rule for all later WPs:* additions to `minicore` must keep both products green."},{"id":"MT-K02","title":"Server profile support","size":"M","wave":2,"note":"","phase":"Phase 0 \u2014 Foundations","track":"K","slug":"mt-k02-server-profile-support-m-wave-2","impl":"","files":"`backend/codeagent/{loop.py,tools_schema.py,prompts.py}` (profile hooks only), new `backend/mate/{__init__.py,router.py,profile.py}`, one `include_router` in `backend/api/server.py`, tests.","what":"`run.start.profile = \"automation\"` selects: the system prompt (`backend/mate/prompts/automation.md`), the **tool catalog** assembled from `backend/mate/tools/*.json` (initially `connector_call`, `notify_owner`, `read_file`, `list_dir`, `glob`, `grep`, `memory_search`, `memory_write`, `skill`, `tasks`, `ask_user`), default budgets by `run_kind`, and the model class from the spec. Code runs unaffected; add a test that a `profile=\"code\"` run is byte-identical to before. *Done when:* both profiles run through the same loop in tests; unknown profiles are rejected; the M2C loop tests pass unchanged."},{"id":"MT-K03","title":"Protocol additions (revision 1.1)","size":"S","wave":2,"note":"","phase":"Phase 0 \u2014 Foundations","track":"K","slug":"mt-k03-protocol-additions-revision-1-1-s-wave-2","impl":"","files":"`protocol/v1/` additive files, fixtures, contract tests.","what":"Additive only: `run.start` fields `run_kind`, `spec_id`, `pipeline_stage`; webhook relay messages `relay.webhook` (server\u2192device: `webhook_id`, `payload`, `received_at`, `sig`) and `relay.ack`; UI relay messages `ui.query` (server\u2192device: `{id, name, args}`) and `ui.reply`; approval events `approval.requested`, `approval.decided`; error codes `automation_paused`, `relay_expired`. New golden fixtures: scheduled run, run skipped for quota, webhook delivery, UI query and reply. *Done when:* all M2C fixtures still validate; new fixtures validate; the byte-equality check between `protocol/` and the packaged copies still passes.\n\n---"},{"id":"MT-N01","title":"Node skeleton and service","size":"M","wave":3,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"N","slug":"mt-n01-node-skeleton-and-service-m-wave-3","impl":"","files":"`menux/pyproject.toml`, `menux/src/menux/{cli.py,node/service.py,node/paths.py,node/config.py}`, `menux/tests/`.","what":"Commands `menux init`, `menux run` (foreground), `menux status`, `menux stop`; `menux service install|uninstall` writing a **systemd user unit** when systemd exists (D2). State under `~/.menux/` (`0700`): `state.db` (reuses `minicore` store), `automations/`, `memory/`, `skills/`, `logs/`. Single-instance lock; graceful shutdown; sign-in reuses `minicore` auth (same device credential flow, labelled as Menux). *Done when:* start and stop are clean; two nodes cannot run at once; `menux status` shows login state and next scheduled runs; works without systemd via foreground mode."},{"id":"MT-N05","title":"Vault","size":"M","wave":3,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"N","slug":"mt-n05-vault-m-wave-3","impl":"\u00a73 D3; product guide \u00a711.5. *Files:* `menux/src/menux/vault/{store.py,keys.py}`, tests. *What:* An encrypted store (`vault.db`, authenticated encryption) for connector and channel secrets. Key sources in order: OS keyring, passphrase-derived (Argon2 or s","files":"`menux/src/menux/vault/{store.py,keys.py}`, tests.","what":"An encrypted store (`vault.db`, authenticated encryption) for connector and channel secrets. Key sources in order: OS keyring, passphrase-derived (Argon2 or scrypt, prompted at node start and cached only in memory), `0600` key file (flagged \"less secure\" by `doctor`). Secrets are only ever read by connector code inside the node process; they never go into model context, logs, tool results or the sandbox. `menux vault add|list|remove` (values are never printed). *Done when:* tests prove ciphertext at rest, wrong key fails closed, secret redaction catches vault values in outgoing text, and a deliberately logged secret is blocked by the redaction filter."},{"id":"MT-G01","title":"Channel abstraction and pairing","size":"M","wave":3,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"G","slug":"mt-g01-channel-abstraction-and-pairing-m-wave-3","impl":"","files":"`menux/src/menux/channels/{base.py,pairing.py,router.py}`, tests.","what":"A `Channel` interface (`start`, `stop`, `send(owner_text, buttons?)`, `on_message`, `on_callback`) and an **owner pairing** flow: the node shows a one-time code; the owner sends it to the bot; the channel records the owner's account ID. Anyone else is a \"stranger\" (G02 handles them). Everything the router receives is labelled `trust: owner | stranger`. *Done when:* pairing succeeds once and codes cannot be reused; strangers never reach the run starter."},{"id":"MT-A02","title":"Planner endpoint and client","size":"L","wave":3,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"A","slug":"mt-a02-planner-endpoint-and-client-l-wave-3","impl":"","files":"`backend/mate/planner.py`, route `POST /v1/mate/plan`, prompt `backend/mate/prompts/planner.md`, `menux/src/menux/planner_client.py`, tests.","what":"Stateless server endpoint. Input: the user's plain-language request plus the node's **capability list** (names, tiers, descriptions only, no secrets). Output: a draft spec (A01 format), a plain-language summary, the tier it needs, an estimated credit range, and open questions. The server **validates the draft with the A01 validator before returning** and retries once with the error if invalid. Nothing is stored. Uses the Brain role or the strong class; metered as `menux` usage. *Done when:* ten scripted requests produce valid specs or specific questions; the validator rejects a deliberately over-privileged draft; no content is persisted (the Q06 canary extended in MT-Q04 covers this)."},{"id":"MT-A03","title":"Dry-run engine","size":"M","wave":3,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"A","slug":"mt-a03-dry-run-engine-m-wave-3","impl":"","files":"`minicore/src/minicore/automation/dryrun.py` (or `menux/`), tests.","what":"Run a spec with **all writes simulated**: connector write tools and `notify_owner` return a canned success and record \"would do X\"; reads use real data (or fixtures in tests). Produces a human-readable report of what would have happened and what it would have cost. *Done when:* a dry run never calls a real write; the report matches the recorded intents."},{"id":"MT-N02","title":"Scheduler","size":"M","wave":4,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"N","slug":"mt-n02-scheduler-m-wave-4","impl":"","files":"`menux/src/menux/node/scheduler.py`, tests.","what":"Cron, interval and manual triggers on `croniter` with time zones and DST handled; a job table in `state.db`; **missed-run policy** per spec (`run_now`, `skip`, `run_if_recent:<minutes>`) computed at node start and after sleep; jitter to avoid every user hitting the server at :00; dedupe by trigger-event ID. *Done when:* tests with a fake clock cover DST changes, a node that was off, rapid restarts and duplicate events."},{"id":"MT-H01","title":"Connector SDK and manifest","size":"M","wave":4,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"H","slug":"mt-h01-connector-sdk-and-manifest-m-wave-4","impl":"","files":"`menux/src/menux/connectors/{base.py,manifest.py,stances.py}`, `docs/menux/connector-sdk.md`, tests.","what":"A connector declares: name, auth method, tools with JSON Schemas, **per-tool tier**, read/write class, egress domains, rate limits and test fixtures. Per-tool **stances** (`allow | ask | block`) from settings. A uniform `call(tool, args)` entry that validates arguments, applies the stance and tier, injects credentials from the vault, calls out only to the declared domains (through `minicore`'s network proxy), enforces a size cap on the parsed result, and returns it labelled with a trust level. *Done when:* a toy connector passes the whole path; an undeclared domain, an oversize result and a blocked stance each fail in tests."},{"id":"MT-N06","title":"Notifier (minimum)","size":"S","wave":4,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"N","slug":"mt-n06-notifier-minimum-s-wave-4","impl":"","files":"`menux/src/menux/notify.py`, tests.","what":"Desktop notifications through `notify-send` or D-Bus when available, falling back to the channel; used for failures, approvals waiting and panic. Never includes message bodies when the user has set `channel_detail: minimal`."},{"id":"MT-N04","title":"Run orchestrator","size":"L","wave":5,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"N","slug":"mt-n04-run-orchestrator-l-wave-5","impl":"","files":"`menux/src/menux/node/runner.py`, tests.","what":"The node-side executor of an automation run: build `run.start` (`profile=automation`, `run_kind`, spec instructions, memory index if any), connect through `minicore`'s link, receive `tool_proposed`, route each call to the right local executor (connector host, file tools, `notify_owner`), apply the policy engine with the **unattended** flag (T02 later; until then only T0\u2013T2 tools are available), send `tool_result`, honor budgets and cancel, write every event to the local store. Handles quota exhaustion (`quota_exhausted` \u2192 skip and notify once), disconnects and resume. *Done when:* a scripted fake server drives a full run; cancel kills in-flight tools; budgets stop a run; events land in `state.db`."},{"id":"MT-H03","title":"Telegram channel and connector","size":"M","wave":5,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"H","slug":"mt-h03-telegram-channel-and-connector-m-wave-5","impl":"","files":"`menux/src/menux/channels/telegram.py`, `connectors/telegram/manifest.yaml`, tests with a fake Bot API.","what":"Long polling with the user's bot token from the vault; owner-only sends (`send_to_owner`, with Markdown escaping and length splitting); inline keyboards for approvals (decisions arrive as callback queries with an opaque approval ID and a nonce, accepted only from the paired owner); rate limiting and backoff on API errors. *Done when:* pairing and send work against the fake API; callbacks from non-owners are ignored; the token never appears in logs."},{"id":"MT-A04","title":"Run lifecycle","size":"M","wave":6,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"A","slug":"mt-a04-run-lifecycle-m-wave-6","impl":"","files":"`menux/src/menux/node/lifecycle.py`, tests.","what":"States `queued \u2192 running \u2192 completed | failed | skipped | paused | awaiting_approval`; one active run per automation by default (queue or drop per spec); retries with backoff for transient failures; one failure notification per failure episode, not per attempt; a per-automation timeline in the store. *Done when:* tests for concurrency, retry limits, notification de-duplication and restart recovery."},{"id":"MT-I01","title":"First automation (acceptance)","size":"M","wave":6,"note":"","phase":"Phase 1 \u2014 First automation (the walking skeleton)","track":"I","slug":"mt-i01-first-automation-acceptance-m-wave-6","impl":"","files":"","what":"End to end on a real machine with a dev model: `menux init`, pair Telegram, say \"send me a short good-morning message with today's date at 07:30\", review the spec and dry run, approve, and watch the scheduled run arrive. Check the shared pool. *Done when:*\n\n- [ ] The Telegram message arrives at the scheduled time; the run is in the local store.\n- [ ] A ledger row exists with `surface='menux'` and the web Usage panel shows it.\n- [ ] No automation content exists in Postgres, logs or Redis after the run (Q06 canary).\n- [ ] The node restarts mid-day and still runs the next scheduled automation.\n- [ ] A skipped run (node off at 07:30) follows the missed-run policy.\n\n---"},{"id":"MT-H02","title":"Connector host (local MCP, stances, trust)","size":"L","wave":7,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"H","slug":"mt-h02-connector-host-local-mcp-stances-trust-l-","impl":"","files":"`menux/src/menux/connectors/host.py`, `mcp_bridge.py`, tests. Reuses M2C's local MCP client (C23).","what":"Runs connectors as in-process Python plugins or as **local MCP servers** (stdio) under the sandbox, with tool descriptions from non-first-party servers marked untrusted and shown to the user at install; deferred tool schemas (tool search); per-server trust levels; credentials injected from the vault by the host, never passed through the model. *Done when:* a local MCP server's tools appear with correct tiers; an unlisted tool is invisible; a poisoned tool description cannot change a stance (tests with fixtures)."},{"id":"MT-T02","title":"Unattended policy layer","size":"L","wave":7,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"T","slug":"mt-t02-unattended-policy-layer-l-wave-7","impl":"product guide \u00a76.7, \u00a711.2\u201311.4. *Files:* `minicore/src/minicore/policy/unattended.py` (extends the C06 decision function), tests. *What:* A decision wrapper used only when `run_kind != interactive`:","files":"`minicore/src/minicore/policy/unattended.py` (extends the C06 decision function), tests.","what":"A decision wrapper used only when `run_kind != interactive`:\n\n1. Only capabilities listed in the spec are visible.\n2. Effective tier above the spec's `tier_max` \u2192 **deny**.\n3. Tier \u2264 T2 \u2192 allow if the capability is listed.\n4. **T3 \u2192 queue an approval** (never auto-allow, never ask interactively).\n5. **T4 and T5 \u2192 deny** in unattended runs.\n6. Any \"ask\" from the base policy becomes \"queue or deny\", never a blocking prompt.\n7. **Fails closed** on any error. *Done when:* a table-driven test over every tier and run kind; a removed capability can never be reached by a model that names it directly; no path turns an unattended \"ask\" into \"allow\"."},{"id":"MT-T03","title":"Approvals store and decision flow","size":"M","wave":8,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"T","slug":"mt-t03-approvals-store-and-decision-flow-m-wave-","impl":"","files":"`menux/src/menux/approvals/{store.py,flow.py}`, tests.","what":"Approvals live in `state.db`: `id`, `run_id`, automation, capability, **exact content** (draft text, command, diff), tier, `expires_at` (default 24 h), `status`. Flow: a T3 call creates an approval and pauses *that call only* (the run may continue other work or finish with the action pending). Decisions: approve once, approve and remember this exact action, edit then approve, deny, deny and pause the automation. On approve the node **re-checks the policy** immediately before executing. Expiry means skipped and logged. Decision sources: local CLI, desktop notification actions, channels (G04), web inbox through the UI relay (K04) with the same nonce checks. *Done when:* tests for expiry, double decisions, replay of an old approval ID, edits changing the content hash (an edited approval needs a fresh decision), and approval after policy change (denied)."},{"id":"MT-T05","title":"Sealed tool endpoints","size":"M","wave":8,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"T","slug":"mt-t05-sealed-tool-endpoints-m-wave-8","impl":"","files":"`menux/src/menux/sealed/{notify_owner.py,draft_reply.py}`, tests.","what":"Fixed-schema tools with hard-coded targets: `notify_owner(text)` (recipient is always the paired owner), `save_report(name, markdown)` (writes only inside the workspace folder), `draft_reply(thread_ref, text)` (creates a **draft** in the user's own mailbox; cannot send). No tool at tier \u2264 T2 accepts a free-form recipient, URL or path. *Done when:* fuzz tests try to smuggle a recipient, URL or path through each argument and fail."},{"id":"MT-T06","title":"Taint for unattended runs","size":"M","wave":8,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"T","slug":"mt-t06-taint-for-unattended-runs-m-wave-8","impl":"product guide \u00a711.3(5); reuses M2C's taint state (C17). *Files:* `minicore/src/minicore/policy/taint_unattended.py`, tests. *What:* A run becomes tainted when any tool result carries `trust: external` (inbound mail bodies, fetched pages, shared documents,","files":"`minicore/src/minicore/policy/taint_unattended.py`, tests.","what":"A run becomes tainted when any tool result carries `trust: external` (inbound mail bodies, fetched pages, shared documents, a stranger's message). Once tainted: every egress-capable or external-write tool becomes **deny** (not ask), the tainted flag and cause are recorded in the run timeline, and the final summary tells the owner. A reader/actor pipeline (T04) is the supported way to use untrusted content *and* act. *Done when:* the poisoned-mail fixture cannot cause any outbound action; the flag appears in the timeline."},{"id":"MT-T07","title":"Panic button and kill switch","size":"S","wave":8,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"T","slug":"mt-t07-panic-button-and-kill-switch-s-wave-8","impl":"","files":"`menux/src/menux/panic.py`, CLI `menux panic`, tests.","what":"One action: stop all runs, mark every automation disabled, drop the vault key from memory (the vault locks until re-unlocked), optionally revoke the device token. Reachable from the CLI, a desktop notification action, a Telegram command from the owner, and (K04) the web button. Everything it did is logged. *Done when:* after panic no run starts, no connector call can decrypt a secret, and resume requires an explicit unlock."},{"id":"MT-H04","title":"Email connector (IMAP: read and draft)","size":"L","wave":8,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"H","slug":"mt-h04-email-connector-imap-read-and-draft-l-wav","impl":"","files":"`menux/src/menux/connectors/imap/*`, manifest, tests with a fake IMAP server.","what":"App-password IMAP (D5). Tools: `search` and `read` (T0, results marked **untrusted** and tainting), `list_folders`, `create_draft` (T2, in the user's own Drafts folder; the connector has **no send tool**). Read results are size-capped and stripped of active content; attachments are not fetched in v1. *Done when:* the injection fixtures (hidden instructions in headers, HTML and plain bodies) are delivered to the model only as labelled data; no code path can send mail."},{"id":"MT-H05","title":"Calendar connector (CalDAV and ICS)","size":"M","wave":8,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"H","slug":"mt-h05-calendar-connector-caldav-and-ics-m-wave-","impl":"","files":"","what":"Read events (T0), free-busy summary, no write in v1. Event titles and descriptions are untrusted text. *Done when:* works against a local CalDAV test server and a static ICS file."},{"id":"MT-H06","title":"Local files connector","size":"M","wave":8,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"H","slug":"mt-h06-local-files-connector-m-wave-8","impl":"","files":"","what":"Folder grants with `r` or `rw` modes stored in settings; reuses M2C's path guard and the two-form denylist; `/mnt/c` grants default to `r` with a warning. Tools: list, read, search, write (T1, inside `rw` grants only, with checkpoints from C08). *Done when:* traversal, symlink and denylist tests pass."},{"id":"MT-A05","title":"Budgets and heartbeat gating","size":"M","wave":8,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"A","slug":"mt-a05-budgets-and-heartbeat-gating-m-wave-8","impl":"","files":"`menux/src/menux/node/budgets.py`, `heartbeat.py`, tests.","what":"Per-run, per-day and per-month credit budgets from the spec, tracked locally from the server's `usage` events; at 80% warn, at 100% pause the automation and notify. **Heartbeat:** a cheap local pre-check script list (new priority mail? calendar change? disk over 90%?) runs first; the model is called only if a check reports a change or the checklist has content; quiet hours and a daily beat cap apply. Default interval 60 minutes. *Done when:* tests prove that an unchanged world costs zero model calls, that budgets pause correctly, and that a node restart does not reset the day's spend (it is rebuilt from the local store)."},{"id":"MT-T04","title":"Reader/actor split runtime","size":"L","wave":9,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"T","slug":"mt-t04-reader-actor-split-runtime-l-wave-9","impl":"product guide \u00a711.3(1)\u2013(3). *Files:* `menux/src/menux/node/pipeline.py`, server prompts `backend/mate/prompts/{reader,actor}.md`, tests. *What:* For specs that declare `pipeline: [reader, actor]`, the node runs **two separate runs**. The **reader** run h","files":"`menux/src/menux/node/pipeline.py`, server prompts `backend/mate/prompts/{reader,actor}.md`, tests.","what":"For specs that declare `pipeline: [reader, actor]`, the node runs **two separate runs**. The **reader** run has only untrusted-content read tools and **no egress or write tools**; it must return JSON that matches a schema in the spec, size-capped and sanitized (strip URLs and markup unless the schema allows them). The **actor** run receives only that structured result plus the owner's instructions, and only sealed T2 tools. Fixtures show the limit: structured fields can still carry an injection, so the actor never gets a free-form send or path tool. *Done when:* the injection corpus run through the pipeline produces no unapproved outbound action; a reader attempting to call a write tool is denied."},{"id":"MT-T08","title":"Anomaly detection","size":"M","wave":9,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"T","slug":"mt-t08-anomaly-detection-m-wave-9","impl":"","files":"","what":"Local heuristics: repeated denies, a tool the automation has never used, cost above three times its median, run time above three times its median, an unexpected stranger message burst. Action: pause the automation and notify once. *Done when:* replayed anomalous timelines trigger and normal ones do not."},{"id":"MT-G02","title":"Stranger handling and rate limits","size":"S","wave":9,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"G","slug":"mt-g02-stranger-handling-and-rate-limits-s-wave-","impl":"","files":"","what":"Strangers' messages are stored as **data** (optionally summarized for the owner on request), never routed to a run starter; per-sender rate limits; a block list. *Done when:* a stranger message cannot start a run, change settings or approve anything."},{"id":"MT-G04","title":"Approval buttons over channels","size":"S","wave":9,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"G","slug":"mt-g04-approval-buttons-over-channels-s-wave-9","impl":"","files":"","what":"Telegram inline buttons for T03 decisions with `channel_detail: minimal` (a ping that says an approval is waiting, details viewed locally or in the web inbox) or `full` (the exact content in the chat). The trust copy states that full details pass through Telegram. *Done when:* callbacks validate owner, nonce and expiry."},{"id":"MT-K04","title":"UI relay (device queries from the browser)","size":"M","wave":9,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"K","slug":"mt-k04-ui-relay-device-queries-from-the-browser-","impl":"","files":"`backend/mate/relay_ui.py`, route `POST /v1/mate/relay/query`, node handler `menux/src/menux/node/ui_handler.py`, tests.","what":"The browser asks the **server**, the server forwards a `ui.query` to the owner's connected device, the device answers with `ui.reply`, and the server passes it through **without storing it**. A fixed whitelist of query names (`automations.list`, `automation.get`, `runs.recent`, `approvals.pending`, `approval.decide`, `memory.list`, `skills.list`, `usage.local`, `panic`). Device offline returns a clear \"device offline\" result. Rate limits; owner session only. Extends M2C's live relay (X04). *Done when:* nothing from replies appears in Postgres, Redis (after delivery) or logs (Q06); an unlisted query name is refused; a different user cannot query someone else's device."},{"id":"MT-A06","title":"Versions and graduation","size":"M","wave":9,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"A","slug":"mt-a06-versions-and-graduation-m-wave-9","impl":"","files":"`menux/src/menux/node/graduation.py`, tests.","what":"Spec versions (every change creates a new version; rollback). New automations start **attended** (outputs go to the owner for review) for N clean runs (default 5); then the node proposes **graduation to unattended** showing the exact policy. Any change to capabilities, tier or egress resets the trial. *Done when:* tests for the state machine and for capability changes resetting graduation."},{"id":"MT-W01","title":"Mate page and inbox (web)","size":"L","wave":10,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"W","slug":"mt-w01-mate-page-and-inbox-web-l-wave-10","impl":"","files":"a new Mate page and navigation entry; components for **Needs you**, **Running now**, **Recent**; tests.","what":"Reads through the UI relay (K04). Approval cards show what, exact content, which automation, tier, and what happens if nothing is done; buttons per T03. Clear states for \"device offline\" and \"no device paired\". *Done when:* an approval raised on the device can be decided from the browser; offline behavior is understandable; node tests, lint and build pass."},{"id":"MT-Q01","title":"Automation eval harness","size":"L","wave":10,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"Q","slug":"mt-q01-automation-eval-harness-l-wave-10","impl":"","files":"","what":"Fixture-driven runs (fake mailbox, calendar and files) of the sample automations in a sandbox, with graders and cost capture; records success, steps, credits, heartbeat skip rate. Extends `backend/evals/` and M2C's harness (Q02)."},{"id":"MT-Q02","title":"Red-team suite v2","size":"L","wave":10,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"Q","slug":"mt-q02-red-team-suite-v2-l-wave-10","impl":"","files":"","what":"Fixtures for injection through mail (headers, HTML, hidden text, calendar invites), filenames and document metadata, MCP descriptions, stranger messages, memory poisoning (added in Phase 3), skill exfiltration with canary secrets, vault extraction attempts, sandbox escapes, and heartbeat abuse. **A release is blocked if any \"no unapproved egress, no external write, no secret read\" test fails.**"},{"id":"MT-Q04","title":"Canary test, extended","size":"M","wave":10,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"Q","slug":"mt-q04-canary-test-extended-m-wave-10","impl":"","files":"","what":"Extend M2C's no-content-at-rest test (Q06) to Menux: planner requests, run buffers, webhook relay, UI relay, ledger, logs and error reports must never contain canary content after the operation completes."},{"id":"MT-I02","title":"Safe unattended (acceptance)","size":"M","wave":11,"note":"","phase":"Phase 2 \u2014 Safe unattended automations","track":"I","slug":"mt-i02-safe-unattended-acceptance-m-wave-11","impl":"","files":"","what":"- [ ] Morning brief (calendar plus mail subjects through the reader/actor pipeline) runs unattended for a week and messages only the owner.\n- [ ] A poisoned email cannot cause any outbound action (red-team green).\n- [ ] An attempted T3 action creates an approval that can be decided on Telegram and in the web inbox; expiry works.\n- [ ] Panic button stops everything and locks the vault.\n- [ ] Budgets pause an over-budget automation; the shared pool and per-surface usage agree.\n- [ ] Canary test green.\n\n---"},{"id":"MT-M01","title":"Memory files and search","size":"M","wave":12,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"M","slug":"mt-m01-memory-files-and-search-m-wave-12","impl":"product guide \u00a77. *Files:* `menux/src/menux/memory/{files.py,index.py,tools.py}`, tests. *What:* Plain Markdown under `~/.menux/memory/`: `MEMORY.md` (durable facts), `USER.md` (preferences), `daily/YYYY-MM-DD.md` (append-only). A **SQLite FTS5 index*","files":"`menux/src/menux/memory/{files.py,index.py,tools.py}`, tests.","what":"Plain Markdown under `~/.menux/memory/`: `MEMORY.md` (durable facts), `USER.md` (preferences), `daily/YYYY-MM-DD.md` (append-only). A **SQLite FTS5 index** (D9) over all of it. Tools `memory_search`, `memory_read`, `memory_write` for the automation profile. Every automatic write is shown to the owner with an undo. Secrets and sensitive categories are not auto-saved (redaction first). *Done when:* search ranks correctly on a fixture set; edits made by the user in an editor are reindexed; undo restores the previous text."},{"id":"MT-M03","title":"Memory poisoning defenses","size":"M","wave":13,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"M","slug":"mt-m03-memory-poisoning-defenses-m-wave-13","impl":"","files":"","what":"Each memory line carries **provenance**: `owner` (typed by or confirmed by the owner) or `source:<kind>:<id>` (derived from external content). Only `owner` lines may be written as **instructions** (\"always forward\u2026\", \"never ask me about\u2026\"); external-source lines are facts only, tagged with their source. Instruction-like text from a non-owner source requires confirmation. The consolidation job never promotes untrusted lines to `MEMORY.md`. *Done when:* poisoned email, web and calendar fixtures never create an instruction line."},{"id":"MT-M02","title":"Consolidation job","size":"M","wave":13,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"M","slug":"mt-m02-consolidation-job-m-wave-13","impl":"","files":"","what":"A built-in system automation (cheap class, budget-capped, runs nightly when the node is up): merge duplicates, resolve contradictions (newest wins unless flagged), roll old daily notes into weekly summaries, propose skill drafts from repeated procedures (MT-M05). Shown in the inbox like any other automation."},{"id":"MT-M04","title":"Skills v2 with permission manifests","size":"L","wave":12,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"M","slug":"mt-m04-skills-v2-with-permission-manifests-l-wav","impl":"","files":"`minicore/src/minicore/skills/manifest.py` and `menux/src/menux/skills/enforce.py`, tests.","what":"Build on the `SKILL.md` loader (C14). Parse the optional `permissions` block (folders, connectors, network, `tier_max`) and **enforce it at runtime**: a skill's scripts run only in the sandbox with exactly those mounts and egress domains; a skill that tries to exceed its manifest is stopped and logged. Skills without a manifest default to the strictest settings (no network, no connectors, read-only workspace). *Done when:* a skill with an undeclared network call fails in the sandbox test; manifest and automation policy intersect, never union."},{"id":"MT-M05","title":"Skill drafts and the review queue","size":"L","wave":13,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"M","slug":"mt-m05-skill-drafts-and-the-review-queue-l-wave-","impl":"","files":"","what":"After a successful multi-step run, a cheap-class job may **propose** a skill draft into `~/.menux/skills/_proposed/`. The review queue runs the server's **reviewer and security-reviewer roles** on it (content is transient), attaches findings and a diff against any existing skill, and shows it in the inbox. **Nothing activates without owner approval.** Approved skills get a version, a recorded dry-run test that must still pass, and a rollback button; usage stats (success, cost) per skill. *Done when:* a proposed skill that contains a network exfiltration is flagged and cannot be activated without an explicit override."},{"id":"MT-M06","title":"Knowledge folders index","size":"M","wave":13,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"M","slug":"mt-m06-knowledge-folders-index-m-wave-13","impl":"","files":"","what":"User-chosen folders indexed with FTS5, with source paths kept for citations. Retrieval only on match. Re-indexing on file events. *Done when:* index respects the denylist and folder grants."},{"id":"MT-M07","title":"Export and import","size":"S","wave":13,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"M","slug":"mt-m07-export-and-import-s-wave-13","impl":"","files":"","what":"Zip export of memory, skills and automations (no secrets); importers for common Markdown memory layouts used by other agent tools (check formats first)."},{"id":"MT-N03","title":"Event triggers","size":"M","wave":12,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"N","slug":"mt-n03-event-triggers-m-wave-12","impl":"","files":"`menux/src/menux/node/triggers/{files.py,system.py}`, tests.","what":"File events (inotify via a maintained library or a polling fallback) with debounce, only inside granted folders; system events through D-Bus signals where available (disk space, network change, USB). Each event gets a dedupe ID and goes through the same lifecycle as a scheduled run."},{"id":"MT-H07","title":"Poll and RSS connector","size":"S","wave":12,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"H","slug":"mt-h07-poll-and-rss-connector-s-wave-12","impl":"","files":"","what":"Diff-based polling of feeds and pages; wakes the model only on change; page text is untrusted and tainting."},{"id":"MT-H08","title":"Webhook relay","size":"L","wave":12,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"H","slug":"mt-h08-webhook-relay-l-wave-12","impl":"\u00a72 O1 (the only inbound content the server touches). *Files:* `backend/migrations/0017_mate_webhook_relay.sql`, `backend/mate/webhooks.py`, routes, `menux/src/menux/node/webhooks.py`, tests. *What:* The user creates a webhook on the device; the server st","files":"`backend/migrations/0017_mate_webhook_relay.sql`, `backend/mate/webhooks.py`, routes, `menux/src/menux/node/webhooks.py`, tests.","what":"The user creates a webhook on the device; the server stores only `webhook_id`, owner, device, a **hash** of the signing secret and limits. `POST /v1/mate/hook/{id}` verifies the signature, enforces size (D10) and rate limits, puts the payload into a **short-TTL Redis queue**, and forwards `relay.webhook` to the device if connected; the device acks and the server deletes the payload. Undelivered payloads are dropped at the TTL (the sender gets a documented status). Replay protection with timestamps and nonces. *Done when:* payloads never touch Postgres or logs; expired payloads vanish; a wrong signature or replay is rejected; the Q04 canary extension covers it."},{"id":"MT-G03","title":"Digest mode and formatting","size":"S","wave":12,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"G","slug":"mt-g03-digest-mode-and-formatting-s-wave-12","impl":"","files":"","what":"Group routine outputs into one daily message; failures and approvals always go through immediately; per-channel formatting."},{"id":"MT-E01","title":"Server-side abuse and limits","size":"M","wave":12,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"E","slug":"mt-e01-server-side-abuse-and-limits-m-wave-12","impl":"","files":"","what":"Per-user concurrent automation runs, runs per hour and day, planner request limits, relay and webhook rate limits, and graceful `rate_limited` errors. Uses M2C's S11 Redis state. *Done when:* limits hold under a load test with a flood of scheduled runs."},{"id":"MT-Q03","title":"Soak tests","size":"M","wave":13,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"Q","slug":"mt-q03-soak-tests-m-wave-13","impl":"","files":"","what":"A 30-day compressed soak (fake clock) of ten automations on test accounts: duplicate runs, missed runs, cost creep, memory growth, approval pile-up, node restarts."},{"id":"MT-I03","title":"Memory and skills (acceptance)","size":"M","wave":14,"note":"","phase":"Phase 3 \u2014 Memory, skills and triggers","track":"I","slug":"mt-i03-memory-and-skills-acceptance-m-wave-14","impl":"","files":"","what":"- [ ] Memory persists across days, is editable by hand, and every automatic write has an undo.\n- [ ] A heartbeat with nothing to do makes zero model calls for a day.\n- [ ] A webhook triggers a run with no content stored server-side.\n- [ ] A skill draft is proposed, reviewed, activated and rolled back.\n- [ ] Poisoning fixtures never create instruction memory.\n\n---"},{"id":"MT-A07","title":"Delegate to M2C","size":"M","wave":15,"note":"","phase":"Phase 4 \u2014 Beta","track":"A","slug":"mt-a07-delegate-to-m2c-m-wave-15","impl":"\u00a73 D14. *What:* A capability `code_task(repo, prompt, mode)` (T3) that runs the installed `m2c -p` in **plan** mode by default through local IPC, so code work stays under M2C's sandbox and policy. Results come back as a summary the owner can open in ","files":"","what":"A capability `code_task(repo, prompt, mode)` (T3) that runs the installed `m2c -p` in **plan** mode by default through local IPC, so code work stays under M2C's sandbox and policy. Results come back as a summary the owner can open in M2C. Pushing or committing always needs an approval. Both products' ledger rows are tagged with their own surface. *Done when:* a CI-failure automation opens a plan-mode session and reports back; M2C not installed gives a clear error."},{"id":"MT-N07","title":"Node `doctor` and WSL keep-alive","size":"M","wave":15,"note":"","phase":"Phase 4 \u2014 Beta","track":"N","slug":"mt-n07-node-doctor-and-wsl-keep-alive-m-wave-15","impl":"","files":"","what":"`menux doctor` reports: Linux or WSL2, systemd availability, service status, vault key source (and the \"less secure\" warning), keyring, sandbox probe, network proxy, clock skew, channel status, last successful scheduled run, and on **WSL2 whether a keep-alive is configured**. `menux wsl-keepalive` prints the exact steps and the Windows-side commands for the user to run (it does not touch Windows settings itself): a scheduled task at login that starts a long-lived `wsl.exe` process, plus the `.wslconfig` idle settings, with the caveat that these did not work on every version in community reports. *Done when:* tests mock each check; output is readable and actionable."},{"id":"MT-E02","title":"Cost estimates","size":"S","wave":15,"note":"","phase":"Phase 4 \u2014 Beta","track":"E","slug":"mt-e02-cost-estimates-s-wave-15","impl":"","files":"","what":"The planner and the web UI show an estimated credit range per run and per month for a spec, computed from the spec's trigger frequency, model class and recent medians (falling back to defaults). Shown as a range, labelled \"estimate\"."},{"id":"MT-Q05","title":"Cost telemetry","size":"S","wave":15,"note":"","phase":"Phase 4 \u2014 Beta","track":"Q","slug":"mt-q05-cost-telemetry-s-wave-15","impl":"","files":"","what":"Content-free metrics: credits per run and per automation, heartbeat skip rate, approval time, failures, planner retries. Feeds your pricing decisions."},{"id":"MT-R02","title":"Docs and trust pages","size":"M","wave":15,"note":"","phase":"Phase 4 \u2014 Beta","track":"R","slug":"mt-r02-docs-and-trust-pages-m-wave-15","impl":"","files":"","what":"Install and quick start; **what runs where** (device vs server) with the \u00a72 O8 copy; what passes through Telegram and model providers; WSL2 limits and keep-alive; the app-password note for email; security model (tiers, unattended rule); panic button; uninstall and data deletion."},{"id":"MT-I04","title":"Beta acceptance","size":"M","wave":16,"note":"","phase":"Phase 4 \u2014 Beta","track":"I","slug":"mt-i04-beta-acceptance-m-wave-16","impl":"","files":"","what":"- [ ] 20\u201350 invited users on mixed Linux and WSL2 setups.\n- [ ] Unit economics measured against your plans; heartbeat costs inside the model.\n- [ ] No critical findings from a security review of the relay, webhook and approval paths.\n- [ ] Red-team, soak and canary suites green on the beta build.\n- [ ] Support runbook: revoke device, panic from the web, read a content-free diagnostics bundle."},{"id":"MT-U01","title":"No-model automations (recipes)","size":"M","wave":9,"note":"A01, N04, T05, A05. *Decision:* D40.","phase":"Phase 4U \u2014 Usability and reach","track":"U","slug":"mt-u01-no-model-automations-recipes-m-earliest-w","impl":"","files":"","what":"a second automation kind, `kind: recipe`, whose body is an ordered list of `steps` from a **closed action catalogue** (`minicore/src/minicore/automation/recipe.py`): `move_file`, `copy_file`, `append_text`, `read_file` (inside a folder grant), `http_get` (egress allowlist only), `diff_against_last`, `when` (simple comparisons on earlier step outputs: equals, contains, changed, size above), and the sealed tools `notify_owner` and `save_report` (`T05`). **Not in the catalogue:** a shell, a permanent delete (a delete moves the file to a recoverable folder), a write to a new recipient, and any model call. Every step has a tier in the capability registry (`T01`); the recipe's effective tier is the highest of its steps; the unattended ceiling is T2 (O6). Data read from an untrusted source (a web page, a downloaded file) is tainted (`T06`) and may reach only the sealed tools. The schema rejects an unknown action (fail closed). The dry run (`A03`) lists exactly what would happen; versions and graduation (`A06`) apply unchanged, and the anomaly detector (`T08`) still watches run counts and runtimes. A recipe makes **no planner call at run time**. The Planner may still *draft* a recipe when asked; the draft is validated like any spec."},{"id":"MT-U03","title":"Degraded mode","size":"S","wave":10,"note":"U01, N04, K02, A05. *Decision:* D41.","phase":"Phase 4U \u2014 Usability and reach","track":"U","slug":"mt-u03-degraded-mode-s-earliest-wave-10","impl":"","files":"","what":"one state machine in the node: `online`, `degraded(reason)` or `paused`, where the reason is one of: server unreachable, sign-in expired, pool exhausted, account paused, plan changed. While `degraded`: recipes keep running on schedule; model runs follow the spec's missed-run policy (skip, run once when back, or ask); local heartbeat pre-checks still run (`A05`). The owner gets **one** message per state change through the primary channel, not one per run, and `menux status`, `doctor` and the inbox show the reason and what is affected. Nothing at T2 or above is replayed when the state returns (the D34 rule). There is no infinite retry (\u00a716 of the feature guide)."},{"id":"MT-Q11","title":"Scripted-model scenario harness","size":"M","wave":11,"note":"Q01, T02, T04, T06. *Decision:* D39.","phase":"Phase 4U \u2014 Usability and reach","track":"Q","slug":"mt-q11-scripted-model-scenario-harness-m-earlies","impl":"","files":"","what":"a deterministic fake model adapter that replays a scripted sequence of model outputs and tool calls, including hostile ones, so every policy, taint, reader/actor, approval and budget scenario can be replayed in CI with **no model call and no credits**. The scenarios cover the `Q02` corpus categories at the decision level (for example: \"an unattended run with tainted context requests an egress tool: the decision is deny\"). Includes the **model-independence test for D39**: each scenario runs under several model labels and size classes (Standard, Advanced, Expert, unknown) and requires **identical** policy decisions. Adds `menux/tests/scenarios/`; `Q01` (live-model evals) and `Q02` (red-team fixtures) are unchanged and still run."},{"id":"MT-U02","title":"Starter templates and the guided first run","size":"M","wave":16,"note":"U01, A03, A06, H03, N07. *Decision:* D42.","phase":"Phase 4U \u2014 Usability and reach","track":"U","slug":"mt-u02-starter-templates-and-the-guided-first-ru","impl":"","files":"","what":"(1) **Six signed starter specs** shipped with the node (`menux/src/menux/templates/*.yaml`): *morning brief* (calendar and mail read, digest to Telegram), *download sorter* (recipe), *folder watcher* (recipe), *site-change or feed digest* (`H07`), *calendar reminder* (`H05`) and *weekly summary of a knowledge folder* (`M06`, needs Phase 3). Each states its tier, capabilities, egress and cost estimate (`E02`, or zero for a recipe). A template installs **disabled**, runs a dry run, then runs attended; graduation (`A06`) is unchanged. A template is an ordinary spec: it gets no privilege a user-written spec cannot get. (2) **`menux init`:** one guided command that checks the platform (`N07` probes), explains and helps set up the WSL2 keep-alive if needed, signs in with the device code, walks through creating the owner's Telegram bot and pairing (`H03`), installs one template, shows its dry run, runs it attended and prints what to do next. Each step says what is stored where (the O8 copy). It never edits Windows settings itself."},{"id":"MT-U06","title":"Security evidence pack","size":"S","wave":16,"note":"Q02, Q03, Q04, R02. *Decision:* D44.","phase":"Phase 4U \u2014 Usability and reach","track":"U","slug":"mt-u06-security-evidence-pack-s-earliest-wave-16","impl":"","files":"","what":"`menux evidence` (and a docs page) emits, for the release build: the version and signing information; the dependency and licence list (`docs/menux/third_party.md` and the lockfile); the red-team, canary and scenario suite results as **counts and suite names, never payloads**; the `doctor` sandbox probe results; and the open-findings list from the latest external review."},{"id":"MT-R05","title":"Reuse-or-build licence review","size":"S","wave":17,"note":"","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"R","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"Feature guide \u00a727 (CX7). Read the licence of every candidate in the \u00a727 table, classify it, and record a decision (dependency, separate process, study only, or build our own) in `docs/menux/third_party.md`; add `NOTICE` entries, pin versions, and write the own-build fallback plan for each. **Blocks** D01, D02, D03, S01, S02, S05, X03, X04, X08 and M12, and from revision 1.2 K06, T14, P03 and P04, from importing any candidate. The \u00a727 table of the feature guide now also lists agent-desktop and the mesh crypto and WebAuthn libraries. *Done when:* every candidate has a recorded decision and CI fails if a dependency is missing from the record."},{"id":"MT-N08","title":"Hardware and display probe for `doctor`","size":"M","wave":17,"note":"Depends on N07.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"N","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"Extends N07. Reports CPU features, RAM, GPU and VRAM, display server (Wayland or X11), compositor, screencast and RemoteDesktop portals, `/dev/uinput` access, AT-SPI state and container runtime, then recommends the perception path (CPU-only or GPU) and explains every warning with a fix. *Done when:* fixtures for GNOME, KDE, Hyprland, i3, X11, no-GPU and GPU machines."},{"id":"MT-K05","title":"Protocol 1.2 (vision and session messages)","size":"S","wave":17,"note":"Depends on K03.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"K","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"Additive revision: image and element-list message parts with a `consent` field and size limits, `perception_path` in run metadata, event types for screen actions, and `mode` (`background`, `shared`, `takeover`). New files only. *Done when:* golden fixtures; M2C and Menux tests stay green."},{"id":"MT-T10","title":"Context-based tiering, grants and the always-confirm list","size":"L","wave":17,"note":"Depends on T02, T03, T07.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"T","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"Feature guide \u00a76.6 and \u00a722. A capability's tier may depend on context (for example `input.contained` is T1 inside a disposable virtual desktop with no accounts and T3\u2013T4 on a profile with logged-in accounts or real files); scoped, time-limited, revocable **grants** replace step-by-step approval for T3\u2013T4 inside their scope; the **always-confirm list** is a hard floor that grants and the dial cannot lower; unknown context is treated as the higher tier. *Done when:* tests for every row of the floor, grant expiry and revocation, panic revoking grants, and \"a user cannot lower a tier by editing YAML\" still holding."},{"id":"MT-X01","title":"Shell and file tool in the sandbox (Reach 1)","size":"M","wave":18,"note":"Depends on K01, T10.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"X","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"Runs commands through the `minicore` sandbox (`bubblewrap`); classifies each command by effect (read-only T0\u2013T1, writes inside granted folders T2\u2013T3, system changes T4, destructive T5); allow and deny lists, output caps, timeouts, dry run, and no network unless the automation's egress list allows it. Reuses M2C's shell tool through `minicore`. *Done when:* red-team cases for command injection, path escapes and destructive commands pass."},{"id":"MT-X02","title":"Application control registry and ladder selector (Reach 2)","size":"L","wave":18,"note":"Depends on T01, H02, T10.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"X","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"Per-application control profiles (id, window match, rungs available, tools, shortcut map, per-operation tier, quirks, measured reliability) and the selector from feature guide \u00a718.3: highest reliable rung first, precondition and postcondition checks, one retry, step down, outcome recorded, Guide mode at the end of the line. New package `menux/src/menux/control/`. *Done when:* selector tests with fake apps for every rung, including \"all rungs fail\" ending in a message to the owner, never a silent failure."},{"id":"MT-D01","title":"Dedicated browser profile (Playwright, optional install)","size":"M","wave":18,"note":"Depends on R05, T04, T06.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"D","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"Unchanged from the earlier plan: separate profile, never the user's daily one; sandboxed; domains through the proxy allowlist; page text is untrusted and tainting. **Reuse (MiniLocker, `m2c_build_plan.md` \u00a711.6):** URL-scheme refusal, page text returned as data with scan and fence, and `attacks/browser_attacks.py` as tests; the Docker and proxy parts are not reused, and approve-before-submit is new work. Registered in X02 as the application-native rung for web pages."},{"id":"MT-D02","title":"Accessibility backend (agent-desktop behind `ControlBackend`, own AT-SPI reader as the Linux fallback)","size":"L","wave":18,"note":"Depends on N08, R05.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"D","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"Accessibility tree first: role plus name targeting; element references that expire; `doctor` reports whether accessibility is enabled and warns if a screen reader must be stopped. **Revision 1.2:** the primary backend is **agent-desktop** (Apache-2.0 as reported on 2026-11-14; confirm in R05) run as a pinned separate process, one session per run, its state directory relocated under `~/.menux/control/` (`0700`), text passed on standard input, trace screenshots off by default and traces redacted before the audit log. Every agent-desktop command is entered in the capability registry with a tier (feature guide \u00a734.5); an unknown command is T5 and denied; a batch takes the highest tier among its entries; held-input commands are denied. Delivery states (`delivered_verified`, `delivered_unverified`, `not_delivered`) feed the selector's retry rule: **retry only when a retry is safe, and check the postcondition first when delivery is unverified** (`X02`). Skills store locators (application, role, name, native ID), never references. The same backend is reused by the Windows and macOS satellites (`P03`, `P04`). **Fallback:** our own AT-SPI reader on Linux (the `computer-use-linux` MCP server remains a candidate), behind the same `ControlBackend` interface. *Done when:* the Linux task suite passes on both backends and an unregistered command is refused."},{"id":"MT-X03","title":"LibreOffice control","size":"L","wave":19,"note":"Depends on X02.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"X","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"Documents, spreadsheets and presentations through LibreOffice's headless UNO interface and macros: read, edit, convert, export to PDF, with no GUI and no pointer. *Done when:* a sample automation edits a spreadsheet while the user works in another window."},{"id":"MT-X04","title":"Scriptable application adapters","size":"L","wave":19,"note":"Depends on X02.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"X","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"FreeCAD, Blender and OpenSCAD through their Python or command-line interfaces; Inkscape and GIMP batch modes as optional adapters. Each adapter is a control profile plus a tested tool. Menux may draft further adapters itself later (X09)."},{"id":"MT-X05","title":"Shortcut maps and input maps","size":"M","wave":19,"note":"Depends on X02, D02.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"X","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"Per-application shortcut tables and user-defined key maps (for example movement keys for a game); validation of maps; conflicts with the user's own shortcuts reported by `doctor`."},{"id":"MT-Q06","title":"Control reliability benchmark","size":"M","wave":20,"note":"Depends on X03, X04, D02.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"Q","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"A fixed task set per application, per rung and per compositor, run on the reference machines; results published in `doctor` and in the docs. A rung below its published threshold is marked \"ask first\" by default."},{"id":"MT-I05a","title":"Native control (acceptance)","size":"M","wave":21,"note":"Depends on R05, N08, K05, T10, X01, X02, X03, X04, X05, D01, D02, Q06.","phase":"Phase 5A \u2014 Native control (Reach 1\u20132)","track":"I","slug":"10-1-phase-5a-native-control-reach-1-2","impl":"","files":"","what":"See \u00a710.5."},{"id":"MT-D03","title":"Screenshots and input","size":"L","wave":19,"note":"Depends on N08, R05.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"D","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Screencast portal for screenshots (may prompt each time); on Wayland the RemoteDesktop portal where available with `ydotool`/`uinput` as the fallback, `xdotool` on X11; per-compositor support matrix in `doctor`. **Reuse candidates:** `computer-use-linux` (portal and `ydotool` handling) and `ydotool` itself, both subject to R05 (`ydotool` is believed to be copyleft: verify, and if it does not fit, write to `uinput` directly or use the portal)."},{"id":"MT-D04","title":"Headless virtual desktop in a container","size":"L","wave":19,"note":"Depends on N08.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"D","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Xvfb or a headless Wayland compositor in a Podman container; disposable; no access to the real session; separate browser profile and files; egress through the allowlist. The substrate for V01."},{"id":"MT-S05","title":"Vision grounding adapter, dual path","size":"L","wave":20,"note":"Depends on N08, D03, K05, R05.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"S","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Feature guide \u00a721. One interface, `ground(screenshot, target) \u2192 element`, with a **CPU path** (accessibility first, CPU OCR, cloud grounding on a downscaled and cropped image, per-task consent) and a **GPU path** (local grounding model). Chosen by the `doctor` probe and overridable. Candidates: OmniParser, UI-TARS, GTA1, Holo, Moondream (licences and weights through R05). *Done when:* the same task suite passes on both paths on the reference machines."},{"id":"MT-V01","title":"Virtual desktop session manager","size":"L","wave":20,"note":"Depends on D03, D04, T10.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"V","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Create, list, snapshot and destroy Menux sessions on D04; launch applications; separate profiles; resource limits; logged-in accounts only through explicit per-site grants (T10); `menux session` commands. *Done when:* two sessions run side by side without touching the user's own session."},{"id":"MT-S01","title":"Screen capture engine","size":"L","wave":20,"note":"Depends on D02, D03, N05.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"S","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Event-driven capture (window focus, navigation, click, scroll or typing pause), de-duplication, throttling, idle and battery pause, exclusions (password managers, banking and payment pages, private windows, password fields), a visible indicator, a one-key pause. Local only. **Off by default.** Screenpipe is a design reference; its licence is reported inconsistently, so no code is copied before R05 decides."},{"id":"MT-E03","title":"Server: vision metering and limits","size":"M","wave":20,"note":"Depends on E01, K05.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"E","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"`/v1/mate/vision/*`; metering of cloud vision calls under `surface='menux'` through the shared `usage_ledger` (reserve migration `0021` only if the ledger cannot carry the new kind); per-user image-size and rate limits; no image stored after the run (extends the Q04 canary)."},{"id":"MT-S02","title":"Text extraction pipeline","size":"L","wave":21,"note":"Depends on S01, R05.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"S","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Accessibility text first, CPU OCR fallback (a Tesseract-class engine, licence through R05), optional local vision; secrets and card-number redaction before anything is stored; thumbnails kept at most 24 hours unless pinned; raw images deleted after extraction."},{"id":"MT-V02","title":"Live view and take-over","size":"L","wave":21,"note":"Depends on V01.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"V","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"An authenticated viewer bound to localhost for a Background session: watch, take over (the user's input goes to the virtual desktop) and hand back; every handover is logged. Remote viewing through the relay is not part of this WP."},{"id":"MT-V03","title":"Shared mode and input arbitration (replaces D05)","size":"L","wave":21,"note":"Depends on V01, D03.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"V","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"User-activity detector; Menux yields on any user input; a visible ghost cursor; resume after idle; automatic move to Background on conflict with a notification; every action visible; kill switch; never unattended on the real session."},{"id":"MT-X06","title":"Pointer and keyboard action layer with verification","size":"L","wave":21,"note":"Depends on X02, D03, S05, T10.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"X","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Actions bound to element references from S05 or D02; stale-reference protection (a failed extraction clears cached elements); precondition and postcondition checks; checkpoints between steps; bounded multi-step plans where every step is verified. *Done when:* a fake-app suite and a real-app suite pass, and failure falls back to Guide mode."},{"id":"MT-T11","title":"Reader/actor for pixels and the task-scope guard","size":"L","wave":21,"note":"Depends on T04, S05.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"T","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Feature guide \u00a726. A tool-less Reader pass turns screenshots and screen text into a typed result (elements, roles, names, visible text as quoted data); the Actor sees only that. The run keeps its original task, and any off-task action (new domain, new application, terminal, download-and-run, permission dialog, credential field) escalates to approval."},{"id":"MT-V04","title":"The tray control panel (the dial)","size":"L","wave":21,"note":"Depends on T10, T07.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"V","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Tray or hidden icon with quick toggles (screen awareness, screen memory, browser capture, mode, pause, panic), per-app allow/ask/block, global ceiling, active grants and hotkeys; a `menux dial` CLI where no tray exists; settings stored locally and surviving restart."},{"id":"MT-V05","title":"Multi-pointer X11 spike (research)","size":"S","wave":22,"note":"Depends on V03.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"V","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Time-boxed. Can two independent pointers and focus points coexist on the user's screen? Output is a findings note only; the product does not depend on it."},{"id":"MT-S03","title":"Screen memory store and search","size":"M","wave":22,"note":"Depends on S02, M01, N05.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"S","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"`~/.menux/screen/` SQLite with FTS5 (no embeddings, decision D9), encrypted with a key derived from the vault key; provenance fields (time, app, window title, URL, source, trust label); retention defaults (proposed: text 30 days, thumbnails 24 hours); disk cap; \"forget last N minutes\", \"forget app\", \"forget everything\"; export."},{"id":"MT-X07","title":"Guide mode","size":"M","wave":22,"note":"Depends on S02, X02.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"X","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"When Menux may not or cannot act, it looks (if screen awareness is allowed) and tells the user the next step in words or as an on-screen hint. It sends no input and needs only T0\u2013T1."},{"id":"MT-Q07","title":"GUI red-team suite","size":"L","wave":22,"note":"Depends on X06, T11, V01.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"Q","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"**Blocks release.** Hostile web pages, fake dialogs and permission prompts, on-screen instructions, clipboard attacks, look-alike windows and drag-and-drop traps; pointer actions must stop when the target cannot be verified."},{"id":"MT-S04","title":"Screen-memory tool for runs","size":"M","wave":23,"note":"Depends on S03, T04.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"S","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"\"What was that article I read on Tuesday?\" queries S03; results pass through the Reader (T04), carry provenance and an untrusted label, and become durable memory only through M03 review."},{"id":"MT-W08","title":"The Menux Map page","size":"L","wave":23,"note":"Depends on K04, A06, M04, X02.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"W","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Web page through the UI relay (K04): applications, connectors, channels, skills, automations and grants with their links, tier, last run and health; click through to open and edit the local spec or skill (edits go to the device, not the server); highlights grants wider than recent use."},{"id":"MT-W09","title":"Screen-memory timeline and settings","size":"M","wave":23,"note":"Depends on S03, K04.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"W","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"A scrollable timeline and search over S03, the indicator state, exclusions, retention settings and forget controls. Live relay only."},{"id":"MT-Q08","title":"Screen-memory privacy and canary tests","size":"M","wave":23,"note":"Depends on S03, Q04.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"Q","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"Nothing from screen memory at rest on the server; exclusions hold; deletion is real (including indexes and backups); encryption at rest verified; a run cannot hide the indicator."},{"id":"MT-I05b","title":"Eyes and hands (acceptance)","size":"M","wave":24,"note":"Depends on D03, D04, S05, V01, S01, E03, S02, V02, V03, X06, T11, V04, V05, S03, X07, Q07, S04, W08, W09, Q08.","phase":"Phase 5B \u2014 Eyes and hands (Reach 3)","track":"I","slug":"10-2-phase-5b-eyes-and-hands-reach-3","impl":"","files":"","what":"See \u00a710.5."},{"id":"MT-X08","title":"Specialist tool kit","size":"L","wave":25,"note":"Depends on X02, R05.","phase":"Phase 5C \u2014 Companion (Reach 4)","track":"X","slug":"10-3-phase-5c-companion-reach-4","impl":"","files":"","what":"A template and test harness for building a purpose-made tool for an application that has no scripting interface or an unreliable one (tool manifest, tier per operation, fixtures, sandboxed tests, versioning). First targets are chosen by user demand; CAD is the leading candidate. *Done when:* one tool for a listed application passes its fixtures."},{"id":"MT-M09","title":"Experience memory","size":"M","wave":25,"note":"Depends on M01, X02.","phase":"Phase 5C \u2014 Companion (Reach 4)","track":"M","slug":"10-3-phase-5c-companion-reach-4","impl":"","files":"","what":"Records which rung and steps worked for which application and task, with outcome and cost; consulted by the selector; local, viewable and deletable; labelled untrusted until confirmed by repeated success."},{"id":"MT-N09","title":"Menux session image (optional)","size":"L","wave":25,"note":"Depends on N08, V01, D03.","phase":"Phase 5C \u2014 Companion (Reach 4)","track":"N","slug":"10-3-phase-5c-companion-reach-4","impl":"","files":"","what":"An installable session (package or script first, later a VM or bootable image) with the display session, portals, `uinput` permission, accessibility and virtual-desktop tooling preconfigured. A full distribution is out of scope until after GA (D22)."},{"id":"MT-X09","title":"Self-built tools and adapters","size":"L","wave":26,"note":"Depends on X08, M05, T10.","phase":"Phase 5C \u2014 Companion (Reach 4)","track":"X","slug":"10-3-phase-5c-companion-reach-4","impl":"","files":"","what":"Menux drafts an adapter script or tool for an application, tests it in the sandbox, and proposes it as a reviewed skill install (T4). Never self-activating."},{"id":"MT-X10","title":"Game loop runner and input maps","size":"L","wave":26,"note":"Depends on X05, X06.","phase":"Phase 5C \u2014 Companion (Reach 4)","track":"X","slug":"10-3-phase-5c-companion-reach-4","impl":"","files":"","what":"Opt-in game profile; a fast local loop (frame sampling, small decisions) with the large model as strategist; engine tools (for example a chess engine) run as separate processes after R05; runs on the virtual desktop; shows the anti-cheat notice; no circumvention."},{"id":"MT-M10","title":"Learn by demonstration","size":"L","wave":26,"note":"Depends on S03, M05, X06.","phase":"Phase 5C \u2014 Companion (Reach 4)","track":"M","slug":"10-3-phase-5c-companion-reach-4","impl":"","files":"","what":"Record mode captures the user doing a task (accessibility events and screen memory); Menux drafts a parameterized skill, dry-runs it, and queues it for review (M05)."},{"id":"MT-M11","title":"GUI skill self-repair","size":"M","wave":26,"note":"Depends on M09, A06, X06.","phase":"Phase 5C \u2014 Companion (Reach 4)","track":"M","slug":"10-3-phase-5c-companion-reach-4","impl":"","files":"","what":"When a postcondition fails after a UI change, try another rung, propose a patched skill version, review it, and keep versions with rollback (A06)."},{"id":"MT-M12","title":"Skill templates and the curated library","size":"L","wave":26,"note":"Depends on M04, M05, Q02, T11, R05.","phase":"Phase 5C \u2014 Companion (Reach 4)","track":"M","slug":"10-3-phase-5c-companion-reach-4","impl":"","files":"","what":"Sanitizer (strip paths, names, emails, tokens, IDs, URLs), parameterization, permission manifest, static scan, canary-secret sandbox trial, publisher identity and signature. The server stores only the template (migration `0020`), never the user's runs or data. Installing a template on another device shows the manifest, tier, egress and applications and stays disabled until the owner enables it. First-party curated library plus opt-in \"submit for review\"; the open marketplace is M08 (Phase 6)."},{"id":"MT-R06","title":"Companion docs and trust pages","size":"M","wave":26,"note":"Depends on R02, S03, V04.","phase":"Phase 5C \u2014 Companion (Reach 4)","track":"R","slug":"10-3-phase-5c-companion-reach-4","impl":"","files":"","what":"The screen-memory trust copy, the perception-path explanation, the dial and grants guide, the WSL2, satellite and Windows or macOS honesty page, and the licences page."},{"id":"MT-I05c","title":"Companion (acceptance)","size":"M","wave":27,"note":"Depends on X08, M09, N09, X09, X10, M10, M11, M12, R06.","phase":"Phase 5C \u2014 Companion (Reach 4)","track":"I","slug":"10-3-phase-5c-companion-reach-4","impl":"","files":"","what":"See \u00a710.5."},{"id":"MT-K06","title":"Mesh protocol, device identity and trust edges","size":"L","wave":28,"note":"Depends on K03, R05.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"K","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"New namespace `protocol/mesh/v1` (new files only; the M2C v1 envelope is not touched): hello with roles and capability names, signed command, acknowledgement, presence, lease, sync-record and mailbox frames, with limits and golden fixtures. Node-side device identity key (OS key store, vault fallback), trust-edge store, six-word fingerprint, mesh-key wrapping. Crypto choices go through `R05` behind a Menux interface. *Done when:* fixtures validate; key rotation and revocation tests pass; M2C and Menux tests stay green."},{"id":"MT-A08","title":"Placement fields in the automation spec","size":"S","wave":28,"note":"Depends on A01, A07.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"A","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"Additive revision of the `A01` schema: `runs_on`, `prefer`, `requires`, `failover` (default `false`). The Planner sees capability names only. *Done when:* old specs still validate and a spec cannot lower a tier through the new fields."},{"id":"MT-T12","title":"Signed command channel and replay protection","size":"L","wave":29,"note":"Depends on K06, T02, T07.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"T","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"Feature guide \u00a731.5. Every remote command is signed by the controller's device key and carries ID, endpoints, command, argument digest, issue time, lifetime and counter. Checks in order: signature, not revoked, lifetime and skew, counter, known command (unknown fails closed), class and ceiling, then the normal policy. Idempotent by command ID; accepted, refused and done acknowledgements. Approvals travel as signed commands, which closes the Phase 2 gap in feature guide \u00a731.8. *Done when:* replay, reorder, expired, wrong-endpoint and unknown-command cases are refused."},{"id":"MT-E04","title":"Server: mesh relay, device registry, presence, leases and mailbox","size":"XL","wave":29,"note":"Depends on K06, E01, S03b.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"E","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"`WS /v1/mate/mesh` and `/v1/mate/devices/*`; migration `0022` (roles, trust edges as device IDs, states, remote ceilings) and `0023` (mailbox ciphertext with size, recipient and expiry); presence; leases in Redis with opaque IDs; per-device and per-account rate limits; revocation closes sockets. Stores no frame bodies and no content. *Done when:* the extended canary (`Q10`) passes and a relay that drops or reorders frames cannot cause a wrong action."},{"id":"MT-T13","title":"Controller classes, ceilings and the remote trust ladder","size":"M","wave":30,"note":"Depends on T12, T10.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"T","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"Feature guide \u00a730\u2013\u00a731. Class and ceiling per device, the approval table by tier and class, travel mode, session limits, tighten-at-once propagation. A controller cannot raise its own class or ceiling. *Done when:* every cell of the table in \u00a731.2 has a test."},{"id":"MT-T14","title":"Passkey step-up","size":"M","wave":30,"note":"Depends on T12, T03.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"T","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"WebAuthn assertion bound to approval ID, nonce, action digest and expiry; the node stores the public key and verifies it itself; assertions are single-use and expire in minutes."},{"id":"MT-N10","title":"Mesh client in the node","size":"M","wave":30,"note":"Depends on T12, N02, E04.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"N","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"Connects, reconnects with backoff, presence, applies commands through the normal policy, fans Panic out to every node in the mesh until acknowledged (survives restart), local link (loopback on, LAN off)."},{"id":"MT-N11","title":"Pairing commands and flows","size":"M","wave":30,"note":"Depends on K06, E04, T12.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"N","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"`menux pair controller`, `menux pair satellite`, `menux remote pair`, `menux devices`, `menux logout` (self-revoke through `S03b`). Node-approved pairing with the six-word check and the ceiling chosen on the node; approval from a trusted-display controller with step-up; every other controller is notified."},{"id":"MT-W10","title":"Devices page for the mesh","size":"M","wave":31,"note":"Depends on E04, N11, K04.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"W","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"Extends the MiniMe Devices page built for M2C (`X01`); does not add a second one. Add-a-device choices, roles, a733. `runs_on` and `requires` routing, the lease protocol, takeover only with `failover: true` after the missed-run policy, fire time as idempotency key, a node that cannot reach the server skips rather than duplicates."},{"id":"MT-V06","title":"Remote live view (view only)","size":"L","wave":32,"note":"Depends on V02, N10, T13, T12.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"V","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"End-to-end encrypted remote path for the `V02` viewer; web class view only, take-over from a trusted display with step-up; visible indicator on the desktop; nothing recorded or stored on the server; its own security review."},{"id":"MT-Q10","title":"Mesh privacy and canary extension","size":"M","wave":32,"note":"Depends on E04, M13, Q04.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"Q","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"**Blocks release.** At rest the server holds only ciphertext for at most 24 hours, deleted on delivery; no frame bodies or run content in logs; notification text minimal; sync never carries secrets or screen memory."},{"id":"MT-Q09","title":"Mesh red-team suite","size":"L","wave":33,"note":"Depends on T12, T13, T14, W11, G05, N12, M13, V06.","phase":"Phase 5R \u2014 Remote control and the device mesh","track":"Q","slug":"10-6-phase-5r-remote-control-and-the-device-mesh","impl":"","files":"","what":"**Blocks release.** Server forges, replays or reorders commands; server adds a controller; hostile web controller code; stolen phone; compromised satellite returns poisoned data; relay man-in-the-middle; revoked device lingers; sync injection; flooding; account takeover."},{"id":"MT-I05r","title":"Remote control and mesh (acceptance)","size":"M","wave":34,"note":"Depends on K06, A08, T12, E04, T13, T14, N10, N11, W10, W11, G05, M13, N12, V06, Q09, Q10.","phase":"Phase 5R \u2014 Remote control const d=e.target.closest('[data-d]');if(d){const x=$('d-'+d.dataset.d);x.style.display=x.style.display=='none'?'block':'none';return}
if(e.target.id=='ex'){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('atlas:'))o[k]=localStorage.getItem(k)}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='atlas-progress.json';a.click()}
if(e.target.id=='im')$('imf').click()});
document.addEventListener('change',e=>{if(e.target.id=='ft'){ft=e.target.value;render()}else if(e.target.id=='fs'){fs=e.target.value;render()}else if(e.target.dataset.k){localStorage.setItem(e.target.dataset.k,e.target.checked?'1':'0')}
else if(e.target.id=='imf'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);Object.keys(o).forEach(k=>localStorage.setItem(k,o[k]));render()})}});
document.addEventListener('input',e=>{if(e.target.id=='fq'){fq=e.target.value;const p=e.target.selectionStart;render();const n=$('fq');n.focus();n.setSelectionRange(p,p)}});
render();</script><script type="module" src="assets/js/shell.js"></script></body></html>
